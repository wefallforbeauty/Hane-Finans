[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hane-finans"
version = "0.0.0"
description = "Aile için kişisel finans: çift taraflı defter, dört birimle net servet (TL, reel TL, USD, gram altın), TCMB ve TÜFE verileri"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
grafik = ["matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "matplotlib>=3.8"]

[project.scripts]
finans = "hane_finans.cli:main"

[tool.setuptools.packages.find]
include = ["hane_finans*"]

[tool.setuptools.package-data]
hane_finans = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
